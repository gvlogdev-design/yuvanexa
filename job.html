<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details — YuvaNexa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-sm font-bold text-slate-700 hover:text-indigo-600">
        ← <span id="back-text">Back to YuvaNexa</span>
      </a>
      <div class="bg-slate-100 p-1 rounded-lg flex items-center border border-slate-200">
        <button onclick="setLang('en')" id="btn-en" class="px-2.5 py-1 rounded-md text-xs font-bold transition bg-white text-indigo-600 shadow-sm">EN</button>
        <button onclick="setLang('hi')" id="btn-hi" class="px-2.5 py-1 rounded-md text-xs font-bold transition text-slate-600">हिंदी</button>
      </div>
    </div>
  </header>

  <!-- Main Job Detail Container -->
  <main id="job-container" class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow">
    <div class="text-center py-20 text-slate-400 font-semibold">Loading verified details...</div>
  </main>

  <script>
    let currentJob = null;
    let currentLang = localStorage.getItem('yuvanexa_lang') || 'en';

    async function init() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      const res = await fetch('jobs.json?v=' + Date.now());
      const jobs = await res.json();
      currentJob = jobs.find(j => j.id === id) || jobs[0];
      setLang(currentLang);
    }

    function setLang(lang) {
      currentLang = lang;
      localStorage.setItem('yuvanexa_lang', lang);
      document.getElementById('btn-en').className = lang === 'en'
        ? 'px-2.5 py-1 rounded-md text-xs font-bold transition bg-white text-indigo-600 shadow-sm'
        : 'px-2.5 py-1 rounded-md text-xs font-bold transition text-slate-600';
      document.getElementById('btn-hi').className = lang === 'hi'
        ? 'px-2.5 py-1 rounded-md text-xs font-bold transition bg-white text-indigo-600 shadow-sm'
        : 'px-2.5 py-1 rounded-md text-xs font-bold transition text-slate-600';
      renderJob();
    }

    function renderJob() {
      if (!currentJob) return;
      const j = currentJob;
      const l = currentLang;
      document.title = `${j.title[l]} — YuvaNexa`;
      document.getElementById('back-text').textContent = l === 'en' ? 'Back to All Jobs' : 'सभी जॉब्स पर वापस जाएं';

      const labels = l === 'en' ? {
        org: 'Conducting Body',
        posts: 'Total Vacancies',
        qual: 'Eligibility / Qualification',
        age: 'Age Limit',
        fee: 'Application Fee',
        dates: 'Important Dates',
        links: 'Important Official Links',
        apply: 'Apply Online / Direct Link',
        notif: 'Download Official Notification',
        web: 'Official Website'
      } : {
        org: 'भर्ती बोर्ड / संस्था',
        posts: 'कुल पद (Vacancies)',
        qual: 'शैक्षणिक योग्यता',
        age: 'आयु सीमा (Age Limit)',
        fee: 'आवेदन शुल्क (Fees)',
        dates: 'महत्वपूर्ण तिथियां',
        links: 'महत्वपूर्ण आधिकारिक लिंक',
        apply: 'ऑनलाइन आवेदन / डायरेक्ट लिंक',
        notif: 'आधिकारिक नोटिफिकेशन डाउनलोड करें',
        web: 'आधिकारिक वेबसाइट'
      };

      document.getElementById('job-container').innerHTML = `
        <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
          <!-- Header Banner -->
          <div class="bg-indigo-700 text-white p-6 sm:p-8">
            <div class="inline-block text-xs font-bold uppercase tracking-wider bg-white/20 px-3 py-1 rounded-full mb-3">
              ${j.organization[l]}
            </div>
            <h1 class="text-xl sm:text-3xl font-extrabold leading-snug mb-3">${j.title[l]}</h1>
            <p class="text-indigo-100 text-sm sm:text-base leading-relaxed">${j.summary[l]}</p>
          </div>

          <!-- Key Highlights Grid -->
          <div class="p-6 sm:p-8 space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                <div class="text-xs font-bold text-slate-500 uppercase">${labels.posts}</div>
                <div class="text-base font-extrabold text-indigo-700 mt-1">${j.totalPosts}</div>
              </div>
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
                <div class="text-xs font-bold text-slate-500 uppercase">${labels.age}</div>
                <div class="text-sm font-bold text-slate-800 mt-1">${j.ageLimit[l]}</div>
              </div>
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 sm:col-span-2">
                <div class="text-xs font-bold text-slate-500 uppercase">${labels.qual}</div>
                <div class="text-sm font-bold text-slate-800 mt-1">${j.qualification[l]}</div>
              </div>
              <div class="p-4 rounded-xl bg-slate-50 border border-slate-200 sm:col-span-2">
                <div class="text-xs font-bold text-slate-500 uppercase">${labels.fee}</div>
                <div class="text-sm font-bold text-slate-800 mt-1">${j.applicationFee[l]}</div>
              </div>
            </div>

            <!-- Important Dates Table -->
            <div>
              <h2 class="text-base font-extrabold text-slate-900 mb-3">${labels.dates}</h2>
              <div class="border border-slate-200 rounded-xl overflow-hidden">
                <table class="w-full text-sm">
                  <tbody class="divide-y divide-slate-200">
                    ${j.importantDates.map(d => `
                      <tr>
                        <td class="px-4 py-3 font-semibold text-slate-600 bg-slate-50 w-1/2">${d.label}</td>
                        <td class="px-4 py-3 font-bold text-slate-900">${d.value}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Action Links -->
            <div>
              <h2 class="text-base font-extrabold text-slate-900 mb-3">${labels.links}</h2>
              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <a href="${j.links.apply}" target="_blank" rel="noopener" class="text-center py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm shadow-sm transition">
                  ${labels.apply} ↗
                </a>
                <a href="${j.links.notification}" target="_blank" rel="noopener" class="text-center py-3.5 px-4 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-sm transition">
                  ${labels.notif} ↗
                </a>
                <a href="${j.links.official}" target="_blank" rel="noopener" class="text-center py-3.5 px-4 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm shadow-sm transition">
                  ${labels.web} ↗
                </a>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
